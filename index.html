<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAE Prep - Advanced English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; top:0; left:0; width:100%; height:100%; }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-red-700 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-xl">🇬🇧 CAE Exam Prep</h1>
        <div>
            <button onclick="showMenu()" class="text-sm bg-red-600 hover:bg-red-800 px-3 py-1 rounded">Main Menu</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-2xl mx-auto p-4 mt-6" id="app-container">

        <!-- MAIN MENU -->
        <div id="view-menu" class="space-y-6">
            <h2 class="text-2xl font-bold text-center">Select a Mode</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="loadStudyMenu()" class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition border-t-4 border-blue-500">
                    <h3 class="text-xl font-bold text-blue-600 mb-2">📚 Study Mode (Flashcards)</h3>
                    <p class="text-sm text-gray-500">Study vocabulary, phrasal verbs, and idioms by topic.</p>
                </button>
                <button onclick="loadTestMenu()" class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition border-t-4 border-green-500">
                    <h3 class="text-xl font-bold text-green-600 mb-2">⏱️ Exam Mode</h3>
                    <p class="text-sm text-gray-500">Mix topics and test yourself with random questions.</p>
                </button>
            </div>
        </div>

        <!-- STUDY MENU -->
        <div id="view-study-menu" class="hidden">
            <button onclick="showMenu()" class="text-red-700 mb-4 font-bold">&larr; Back</button>
            <h2 class="text-xl font-bold mb-4">Select a Topic to Study</h2>
            <div id="study-topics-list" class="space-y-2">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- STUDY FLASHCARDS VIEW -->
        <div id="view-study-cards" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="loadStudyMenu()" class="text-red-700 font-bold">&larr; Back</button>
                <span id="study-progress" class="text-sm font-bold text-gray-500">1 / 10</span>
            </div>
            <div class="flex justify-between items-center mb-2">
                <h2 id="study-topic-title" class="text-sm text-red-700 font-bold uppercase">Topic</h2>
                <span id="study-category" class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded font-bold uppercase">Category</span>
            </div>

            <div class="relative w-full h-96 cursor-pointer card perspective-1000" onclick="this.classList.toggle('flipped')">
                <div class="card-inner w-full h-full relative">
                    <!-- Front -->
                    <div class="card-front bg-white p-6 rounded-xl shadow-md flex flex-col justify-center items-center border border-gray-200">
                        <p id="study-term" class="text-2xl font-bold text-center">Loading...</p>
                        <p class="text-xs text-gray-400 mt-6 animate-pulse">Tap to flip</p>
                    </div>
                    <!-- Back -->
                    <div class="card-back bg-red-50 p-6 rounded-xl shadow-md flex flex-col justify-center items-center border border-red-200 overflow-y-auto">
                        <p id="study-def" class="text-xl font-bold text-red-800 text-center mb-4">Definition</p>
                        <p id="study-exp" class="text-sm text-gray-700 text-center italic">Explanation / Example</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-between mt-6">
                <button onclick="prevCard()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded font-bold">Previous</button>
                <button onclick="nextCard()" class="bg-red-700 hover:bg-red-800 text-white px-6 py-2 rounded font-bold">Next</button>
            </div>
        </div>

        <!-- TEST CONFIGURATION -->
        <div id="view-test-config" class="hidden">
            <button onclick="showMenu()" class="text-red-700 mb-4 font-bold">&larr; Back</button>
            <h2 class="text-xl font-bold mb-4">Configure Exam</h2>
            <p class="text-sm text-gray-600 mb-4">Select the topics you want to include in the practice exam.</p>
            <div id="test-topics-list" class="space-y-2 mb-6 bg-white p-4 rounded-xl shadow">
                <!-- Injected via JS -->
            </div>
            <button onclick="startTest()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow">
                Start Exam (30 Questions)
            </button>
        </div>

        <!-- EXAM ENGINE -->
        <div id="view-exam" class="hidden">
             <div class="flex justify-between items-center mb-4">
                <button onclick="showMenu()" class="text-gray-500 font-bold text-sm">Quit Exam</button>
                <span id="exam-progress" class="text-sm font-bold bg-green-100 text-green-800 px-2 py-1 rounded">1 / 30</span>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md mb-4">
                <p id="exam-topic-label" class="text-xs text-gray-400 font-bold uppercase mb-2">Topic</p>
                <p id="exam-question" class="text-lg font-bold text-gray-800">Question?</p>
            </div>

            <div id="exam-options" class="space-y-3">
                <!-- Buttons injected via JS -->
            </div>

            <div id="exam-feedback" class="mt-6 hidden p-4 rounded-lg">
                <p id="exam-explanation" class="text-sm mt-2"></p>
                <button onclick="nextExamQuestion()" class="mt-4 w-full bg-gray-800 text-white py-3 rounded font-bold">Next Question</button>
            </div>
        </div>

    </div>

    <script>
        // --- GLOBAL STATE ---
        let topicsCatalog = [];
        let currentStudyCards = [];
        let studyIndex = 0;

        let currentExamQuestions = [];
        let examIndex = 0;
        let examScore = 0;

        // --- 1. BOOTSTRAP ---
        window.onload = async () => {
            try {
                const response = await fetch('data/temas.json'); 
                topicsCatalog = await response.json();
            } catch (error) {
                alert("Error loading data/temas.json. Make sure you are running this on a server (Live Server, Netlify, etc.).");
            }
        };

        // --- NAVIGATION ---
        function hideAllViews() {
            document.querySelectorAll('#app-container > div').forEach(div => div.classList.add('hidden'));
        }

        function showMenu() {
            hideAllViews();
            document.getElementById('view-menu').classList.remove('hidden');
        }

        // --- STUDY MODE ---
        function loadStudyMenu() {
            hideAllViews();
            const list = document.getElementById('study-topics-list');
            list.innerHTML = '';

            topicsCatalog.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-lg border flex justify-between items-center ${topic.active ? 'bg-white hover:bg-red-50 border-gray-200' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`;
                btn.innerHTML = `<span class="font-bold">${topic.title}</span> <span>${topic.active ? '▶' : '🔒'}</span>`;
                if(topic.active) {
                    btn.onclick = () => initStudySession(topic);
                }
                list.appendChild(btn);
            });
            document.getElementById('view-study-menu').classList.remove('hidden');
        }

        async function initStudySession(topicMeta) {
            try {
                const res = await fetch(topicMeta.file);
                const data = await res.json();
                currentStudyCards = data.study;
                studyIndex = 0;

                document.getElementById('study-topic-title').innerText = data.title;
                renderStudyCard();

                hideAllViews();
                document.getElementById('view-study-cards').classList.remove('hidden');
            } catch(e) {
                alert("Could not load topic information.");
            }
        }

        function renderStudyCard() {
            const cardElement = document.querySelector('.card');
            cardElement.classList.remove('flipped');

            setTimeout(() => {
                const card = currentStudyCards[studyIndex];
                document.getElementById('study-term').innerText = card.term;
                document.getElementById('study-def').innerText = card.definition;
                document.getElementById('study-exp').innerText = card.explanation || '';
                document.getElementById('study-category').innerText = card.category || 'Vocabulary';
                document.getElementById('study-progress').innerText = `${studyIndex + 1} / ${currentStudyCards.length}`;
            }, 150);
        }

        function nextCard() {
            if (studyIndex < currentStudyCards.length - 1) { studyIndex++; renderStudyCard(); }
        }
        function prevCard() {
            if (studyIndex > 0) { studyIndex--; renderStudyCard(); }
        }

        // --- EXAM MODE ---
        function loadTestMenu() {
            hideAllViews();
            const list = document.getElementById('test-topics-list');
            list.innerHTML = '';

            topicsCatalog.forEach((topic, i) => {
                if(!topic.active) return;
                const label = document.createElement('label');
                label.className = "flex items-center space-x-3 p-3 border-b border-gray-100 last:border-0 cursor-pointer";
                label.innerHTML = `
                    <input type="checkbox" checked id="chk-${i}" class="w-5 h-5 text-green-600 rounded focus:ring-green-500" value="${topic.file}">
                    <span class="font-medium text-gray-700">${topic.title}</span>
                `;
                list.appendChild(label);
            });
            document.getElementById('view-test-config').classList.remove('hidden');
        }

        async function startTest() {
            const checkboxes = document.querySelectorAll('#test-topics-list input[type="checkbox"]:checked');
            if(checkboxes.length === 0) return alert("Select at least one topic!");

            let allQuestions = [];

            for (let chk of checkboxes) {
                const res = await fetch(chk.value);
                const data = await res.json();
                const questionsWithTopic = data.test.map(q => ({...q, _topicTitle: data.title}));
                allQuestions = allQuestions.concat(questionsWithTopic);
            }

            // Shuffle and select max 30 questions
            allQuestions = allQuestions.sort(() => Math.random() - 0.5);
            currentExamQuestions = allQuestions.slice(0, 30);
            examIndex = 0;
            examScore = 0;

            hideAllViews();
            document.getElementById('view-exam').classList.remove('hidden');
            renderExamQuestion();
        }

        function renderExamQuestion() {
            if(examIndex >= currentExamQuestions.length) {
                alert(`Exam finished! Score: ${examScore} out of ${currentExamQuestions.length}.`);
                showMenu();
                return;
            }

            const q = currentExamQuestions[examIndex];
            document.getElementById('exam-progress').innerText = `Q: ${examIndex + 1} / ${currentExamQuestions.length}`;
            document.getElementById('exam-topic-label').innerText = q._topicTitle;
            document.getElementById('exam-question').innerText = q.question;

            const optionsContainer = document.getElementById('exam-options');
            optionsContainer.innerHTML = '';
            document.getElementById('exam-feedback').classList.add('hidden');

            q.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border-2 border-gray-200 bg-white hover:border-red-400 focus:outline-none transition-colors";
                btn.innerText = optText;
                btn.onclick = () => handleExamAnswer(index, q.correctIndex, btn, q.explanation);
                optionsContainer.appendChild(btn);
            });
        }

        function handleExamAnswer(selectedIndex, correctIndex, selectedBtn, explanation) {
            const buttons = document.getElementById('exam-options').children;

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].onclick = null;
                buttons[i].classList.remove('hover:border-red-400');

                if (i === correctIndex) {
                    buttons[i].classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                }
            }

            if (selectedIndex !== correctIndex) {
                selectedBtn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
            } else {
                examScore++;
            }

            const feedbackBox = document.getElementById('exam-feedback');
            feedbackBox.classList.remove('hidden');
            feedbackBox.classList.add(selectedIndex === correctIndex ? 'bg-green-50' : 'bg-red-50');

            document.getElementById('exam-explanation').innerHTML = `
                <span class="font-bold ${selectedIndex === correctIndex ? 'text-green-600' : 'text-red-600'}">
                    ${selectedIndex === correctIndex ? '✅ Correct!' : '❌ Incorrect.'}
                </span><br><br>
                <span class="text-gray-700">${explanation}</span>
            `;
        }

        function nextExamQuestion() {
            examIndex++;
            renderExamQuestion();
        }
    </script>
</body>
</html>
